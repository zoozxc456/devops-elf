# 各 Docker 主機的 metrics 由 Alloy 用 remote_write 推進來，這裡只抓監控主機自己的元件。
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]

  - job_name: loki
    static_configs:
      - targets: [loki:3100]

  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]
