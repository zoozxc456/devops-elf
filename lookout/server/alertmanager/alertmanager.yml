# 預設不發送通知；取消下方所需管道的註解即可啟用，可同時開啟多種。
# webhook / token 放 server/secrets/<檔名>，權限 65534:65534 / 0400。
route:
  receiver: default
  group_by: [alertname, host, env, service, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

