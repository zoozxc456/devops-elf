templates:
  - /etc/alertmanager/*.tmpl

inhibit_rules:
  # 某台 prod 主機的 agent 斷線時，「容器不見」「log 不見」都是同一件事的連帶結果，不重複通知。
  # equal: host 讓 inhibit 只作用在同一台主機，不會誤壓其他主機的告警
  - source_matchers: [alertname="LookoutAgentDown"]
    target_matchers: [alertname=~"ContainerDown|LogsMissing|AppTargetDown"]
    equal: [host]
